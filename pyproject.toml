[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wc4-font-builder"
version = "1.0.0"
description = "Text-driven OpenType font subset builder for WC4 mod tooling"
readme = "README.md"
license = "MIT"
authors = [
  { name = "WC4 Font Builder contributors" },
]
requires-python = ">=3.10"
keywords = ["fonttools", "opentype", "subset", "wc4", "modding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "fonttools>=4.55,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyinstaller>=6,<7",
]

[project.scripts]
wc4-font-build = "wc4_font_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

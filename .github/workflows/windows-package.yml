name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Canonical tests
        run: |
          python -m pytest -q
          python -m compileall -q src tests
      - name: Build Windows package
        run: python tools/build_windows.py
      - name: Packaged GUI self-test
        run: build\windows_v1\dist\WC4FontBuilder.exe --self-test
      - name: Packaged CLI smoke test
        run: build\windows_v1\dist\wc4-font-build.exe --help
      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if ($archive.Count -ne 1) { throw "expected exactly one release archive" }
          python tools/verify_windows_release.py $archive.FullName --write-checksum "$($archive.FullName).sha256.txt"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if-no-files-found: error
          archive: false
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if ($archive.Count -ne 1) { throw "expected exactly one release archive" }
          gh release create "${{ github.ref_name }}" $archive.FullName "$($archive.FullName).sha256.txt" --verify-tag --title "WC4 Font Builder ${{ github.ref_name }}" --generate-notes

name: Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: recover v1.0.0 package')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Canonical tests
        run: |
          python -m pytest -q
          python -m compileall -q src tests tools
      - name: Build Windows package
        run: python tools/build_windows.py
      - name: Packaged GUI self-test
        run: build\windows_v1\dist\WC4FontBuilder.exe --self-test
      - name: Packaged CLI smoke test
        run: build\windows_v1\dist\wc4-font-build.exe --help
      - name: Verify release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if ($archive.Count -ne 1) { throw "expected exactly one release archive" }
          python tools/verify_windows_release.py $archive.FullName --write-checksum "$($archive.FullName).sha256.txt"
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if-no-files-found: error
          archive: false
      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: recover v1.0.0 package')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
        run: |
          $archive = Get-ChildItem build/windows_v1/WC4FontBuilder-v*-windows-x64.zip
          if ($archive.Count -ne 1) { throw "expected exactly one release archive" }
          $checksum = "$($archive.FullName).sha256.txt"
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $archive.FullName $checksum --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $archive.FullName $checksum --verify-tag --title "WC4 Font Builder $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
